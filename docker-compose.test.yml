services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: optio_test
      POSTGRES_PASSWORD: optio_test
      POSTGRES_DB: postgres
    ports: ["54329:5432"]
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optio_test -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports: ["63790:6379"]
    command: redis-server --databases 4096
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
